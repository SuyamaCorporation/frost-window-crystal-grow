<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霜 窓 結晶 成長 DLA</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center p-3">
<h1 class="text-xl font-bold text-blue-300 mb-1">❄ 霜結晶 成長シミュレーション（DLA）</h1>
<p class="text-gray-500 text-xs mb-2">拡散律速凝集（DLA）で雪の結晶状の霜が成長します</p>

<div class="flex flex-wrap gap-3 justify-center mb-2">
  <button id="startBtn" onclick="toggleStart()" class="bg-blue-900 hover:bg-blue-800 px-4 py-1.5 rounded text-sm font-bold" aria-label="開始">▶ 開始</button>
  <button onclick="resetDLA()" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-sm" aria-label="リセット">⟳ リセット</button>
  <label class="flex items-center gap-1 text-xs">
    速度: <input type="range" id="speedSlider" min="1" max="50" value="20" class="w-16" aria-label="成長速度">
  </label>
  <div class="flex gap-1 items-center text-xs">
    色温度:
    <button onclick="setColorTemp('cool')" id="tcCool" class="px-2 py-1 rounded text-xs border-2 border-blue-400 bg-blue-950" aria-label="寒色">寒色</button>
    <button onclick="setColorTemp('warm')" id="tcWarm" class="px-2 py-1 rounded text-xs border border-gray-600 bg-gray-800" aria-label="暖色">暖色</button>
  </div>
</div>

<canvas id="dlaCanvas" class="rounded-lg border border-blue-950"
  width="480" height="480" aria-label="霜結晶成長キャンバス"></canvas>

<div class="mt-2 text-xs text-gray-500 flex gap-4">
  <span>結晶粒子: <span id="particleCount" class="text-blue-300 font-bold">0</span></span>
  <span>成長半径: <span id="growRadius" class="text-cyan-300">0</span>px</span>
</div>

<script>
const canvas = document.getElementById('dlaCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CX = W/2, CY = H/2;

let grid = new Uint8Array(W*H);
let particles = 0, maxRadius = 0, running = false, animTimer = null;
let colorTemp = 'cool';

function setColorTemp(t) {
  colorTemp = t;
  document.getElementById('tcCool').className=`px-2 py-1 rounded text-xs ${t==='cool'?'border-2 border-blue-400 bg-blue-950':'border border-gray-600 bg-gray-800'}`;
  document.getElementById('tcWarm').className=`px-2 py-1 rounded text-xs ${t==='warm'?'border-2 border-yellow-400 bg-yellow-950':'border border-gray-600 bg-gray-800'}`;
}

function particleColor(dist) {
  // Normalize dist
  const n = Math.min(1, dist / (W*0.4));
  if(colorTemp==='cool') {
    // Dark blue center -> bright ice blue/white outer
    const r = Math.floor(180*n + 30*(1-n));
    const g = Math.floor(230*n + 80*(1-n));
    const b = Math.floor(255);
    const a = 0.6 + n*0.4;
    return `rgba(${r},${g},${b},${a})`;
  } else {
    // Warm: golden/yellow ice
    const r = 255;
    const g = Math.floor(200*n + 120*(1-n));
    const b = Math.floor(100*n + 20*(1-n));
    const a = 0.6 + n*0.4;
    return `rgba(${r},${g},${b},${a})`;
  }
}

function resetDLA() {
  if(animTimer) { clearInterval(animTimer); animTimer=null; running=false; }
  document.getElementById('startBtn').textContent='▶ 開始';
  grid = new Uint8Array(W*H);
  particles = 0; maxRadius = 0;
  ctx.clearRect(0,0,W,H);
  // Dark background
  const grad = ctx.createRadialGradient(CX,CY,0,CX,CY,W/2);
  grad.addColorStop(0,'#0a1520');
  grad.addColorStop(1,'#020508');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  // Seed particle at center
  const si = Math.round(CY)*W + Math.round(CX);
  grid[si] = 1;
  drawParticle(CX, CY, 0);
  particles = 1;
  updateStats();
}

function drawParticle(px, py, dist) {
  const col = particleColor(dist);
  const sz = 1 + Math.random()*0.5;
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(px), Math.round(py), sz, sz);
  // Glow
  if(Math.random()<0.3){
    ctx.fillStyle = colorTemp==='cool'?'rgba(200,240,255,0.15)':'rgba(255,230,150,0.15)';
    ctx.fillRect(Math.round(px)-1, Math.round(py)-1, 3, 3);
  }
}

function isOccupied(ix, iy) {
  if(ix<0||ix>=W||iy<0||iy>=H) return false;
  return grid[iy*W+ix]===1;
}

function hasNeighbor(ix, iy) {
  return isOccupied(ix-1,iy)||isOccupied(ix+1,iy)||isOccupied(ix,iy-1)||isOccupied(ix,iy+1);
}

function stepDLA(count) {
  // Launch count random walkers, walk until they hit the cluster
  for(let n=0;n<count;n++){
    // Start from a random position on a circle slightly outside current cluster
    const spawnR = maxRadius + 20 + Math.random()*10;
    if(spawnR > W*0.45) continue; // stop if too big
    const angle = Math.random()*Math.PI*2;
    let wx = CX + Math.cos(angle)*spawnR;
    let wy = CY + Math.sin(angle)*spawnR;
    let steps = 0;
    const maxSteps = 2000;
    while(steps < maxSteps){
      // Random walk
      const dir = Math.floor(Math.random()*4);
      if(dir===0) wx++;
      else if(dir===1) wx--;
      else if(dir===2) wy++;
      else wy--;
      steps++;
      // Check bounds
      if(wx<0||wx>=W||wy<0||wy>=H) break;
      const ix=Math.round(wx), iy=Math.round(wy);
      if(hasNeighbor(ix,iy)){
        // Attach!
        grid[iy*W+ix]=1;
        const dist=Math.sqrt((ix-CX)**2+(iy-CY)**2);
        drawParticle(ix,iy,dist);
        if(dist>maxRadius) maxRadius=dist;
        particles++;
        break;
      }
    }
  }
  updateStats();
}

function updateStats() {
  document.getElementById('particleCount').textContent=particles;
  document.getElementById('growRadius').textContent=Math.round(maxRadius);
}

function toggleStart() {
  if(running){
    clearInterval(animTimer); animTimer=null; running=false;
    document.getElementById('startBtn').textContent='▶ 開始';
  } else {
    running=true;
    document.getElementById('startBtn').textContent='⏸ 停止';
    function tick(){
      if(!running){return;}
      const speed=parseInt(document.getElementById('speedSlider').value);
      stepDLA(speed);
      if(maxRadius>W*0.42){
        clearInterval(animTimer);animTimer=null;running=false;
        document.getElementById('startBtn').textContent='完成！';
      }
    }
    animTimer=setInterval(tick,16);
  }
}

resetDLA();
</script>
</body>
</html>
